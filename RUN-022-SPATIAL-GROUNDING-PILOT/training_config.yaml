# AXIS Spatial Grounding Scientific Training Pilot Configuration
# Run: RUN-022-SPATIAL-GROUNDING-PILOT
# Base Model: Qwen/Qwen2-VL-7B-Instruct @ eed13092ef92e448dd6875b2a00151bd3f7db0ac

model:
  name_or_path: "Qwen/Qwen2-VL-7B-Instruct"
  revision: "eed13092ef92e448dd6875b2a00151bd3f7db0ac"
  torch_dtype: "bfloat16"
  low_cpu_mem_usage: true
  device_map: "auto"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  freeze_vision_tower: true

dataset:
  name: "AXIS_SPATIAL_SUPERVISION_V1"
  train_file: "RUN-021-SPATIAL-SUPERVISION/train.jsonl"
  validation_file: "RUN-021-SPATIAL-SUPERVISION/validation.jsonl"
  test_file: "RUN-021-SPATIAL-SUPERVISION/test.jsonl"
  images_base_dir: "RUN-021-SPATIAL-SUPERVISION"
  min_pixels: 200704
  max_pixels: 262144
  max_seq_length: 1536

training:
  output_dir: "RUN-022-SPATIAL-GROUNDING-PILOT/checkpoints"
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  optim: "paged_adamw_8bit"
  gradient_checkpointing: true
  bf16: true
  fp16: false
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 250
  save_total_limit: 3
  seed: 42
  report_to: "none"
