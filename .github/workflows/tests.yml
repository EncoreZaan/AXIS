name: Tests

# AXIS previously had no CI/CD at all. This workflow is scoped to what a
# fresh public clone can actually validate: package installability and the
# subset of tests that do not require the private RAW dataset corpus (see
# REPRODUCIBILITY.md, "Automated Test Suite: What Actually Runs on a Fresh
# Clone"). Most of tests/ asserts against dataset/... paths that are not
# redistributed here (DATASET.md, "Data Access Policy"), so running the full
# suite as a hard pass/fail gate would make CI permanently and misleadingly
# red. The data-dependent subset still runs, but as an informational job that
# cannot block merges on failures that have nothing to do with the changed
# code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  install-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Import smoke test
        run: |
          python -c "import dataset_tools.master_pipeline.config; import evaluation.runners.benchmark_runner"

  unit-tests-no-private-data:
    runs-on: ubuntu-latest
    needs: install-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests that do not require the private dataset corpus
        # These two files were verified (see REPRODUCIBILITY.md) to pass on a
        # fresh clone with no dataset/ tree present. This is a hard gate.
        run: pytest tests/test_audit_validators.py tests/test_master_pipeline.py -v

  full-suite-informational:
    runs-on: ubuntu-latest
    needs: install-and-lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run full test suite (informational — most tests require the private dataset corpus and are expected to fail/error here)
        run: pytest tests/ -v
